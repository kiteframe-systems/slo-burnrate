[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slo-burnrate"
version = "0.1.0"
description = "Small utilities for error budgets and burn rates"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Kiteframe Systems", email = "theeviecue@proton.me"}]
keywords = ["sre", "slo", "error-budget", "burn-rate", "reliability"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "psycopg[binary]>=3.1.18",
  "requests>=2.31.0"
]

[project.scripts]
slo-burnrate = "slo_burnrate.cli:main"
